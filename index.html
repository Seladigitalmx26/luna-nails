<!doctype html>
<html lang="es">
<head>

  <title>Luna Nails Studio</title>
  <meta name="theme-color" content="#f7efe3">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html,body{margin:0;height:100%;background:#f7efe3;font-family:Arial,sans-serif}

    iframe{border:0;width:100%;flex:1;background:white}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">Luna Nails Studio</div>
    <iframe src="https://script.google.com/macros/s/AKfycbwolpBlnBeiigvl4c7FS8hH96w1rchFKJMVlsaQPWga0neu7wEZbEtIJaJ48SMcRh84/exec" title="Luna Nails"></iframe>
    <div class="fallback">Si el sistema no carga dentro de la app, <a href="https://script.google.com/macros/s/AKfycbwolpBlnBeiigvl4c7FS8hH96w1rchFKJMVlsaQPWga0neu7wEZbEtIJaJ48SMcRh84/exec">ábrelo aquí</a>.</div>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>

</html>
